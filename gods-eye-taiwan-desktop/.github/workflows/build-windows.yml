
name: Build Windows Installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare pinned upstream + Taiwan overlay
        shell: pwsh
        run: ./scripts/prepare-upstream.ps1
      - name: Install web dependencies
        working-directory: .work/upstream
        run: npm install
      - name: Generate platform icons
        working-directory: .work/upstream
        run: npx tauri icon branding/icon-master.png
      - name: Build NSIS installer
        working-directory: .work/upstream
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: gods-eye-taiwan-windows-installer
          path: .work/upstream/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
