<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>正在開啟上帝之眼・台灣版</title>
  <style>
    :root{color-scheme:dark;font-family:"Microsoft JhengHei",sans-serif;background:#06101b;color:#effaff}
    body{min-height:100vh;margin:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#12364a 0,#071827 42%,#050d16 78%)}
    main{width:min(420px,calc(100vw - 48px));padding:32px;border:1px solid #27758d;border-radius:22px;background:#081b2bdc;text-align:center;box-shadow:0 24px 80px #0009}
    img{width:112px;height:112px;object-fit:contain}h1{font-size:23px;letter-spacing:.06em;margin:14px 0 4px}small{color:#9dc8d6;letter-spacing:.17em}
    p{color:#b7d2dc;line-height:1.7}.bar{height:4px;margin-top:24px;border-radius:4px;background:#123548;overflow:hidden}.bar:before{content:"";display:block;width:35%;height:100%;background:linear-gradient(90deg,#34d1ea,#e2bc75);animation:scan 1.8s ease-in-out infinite alternate}
    @keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
    #slow{display:none;margin-top:18px;font-size:12px;color:#e5c486}
  </style>
</head>
<body>
  <main>
    <img src="../branding/icon-user-v4.png" alt="上帝之眼標誌">
    <h1>上帝之眼・台灣版</h1>
    <small>魔改人 官毅明</small>
    <p>正在啟動本機圖資與即時資料服務…</p>
    <div class="bar" aria-label="啟動中"></div>
    <p id="slow">啟動時間較長。若未自動開啟，請查看專案 logs 資料夾中的 desktop-launch.log。</p>
  </main>
  <script>
    const target = 'http://127.0.0.1:4175/';
    const started = Date.now();
    function probe() {
      const image = new Image();
      image.onload = () => location.replace(target);
      image.onerror = () => {
        if (Date.now() - started > 25000) document.getElementById('slow').style.display = 'block';
        setTimeout(probe, 650);
      };
      image.src = target + 'branding/title-art-user-v4.png?ready=' + Date.now();
    }
    probe();
  </script>
</body>
</html>
