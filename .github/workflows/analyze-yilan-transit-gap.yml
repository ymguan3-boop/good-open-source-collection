name: Analyze Yilan vulnerable-transit gap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/analyze-yilan-transit-gap.yml"
      - ".github/scripts/build_yilan_vulnerable_transit_gap.py"

permissions:
  contents: write

concurrency:
  group: analyze-yilan-vulnerable-transit-gap
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install GeoLibre MCP runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests "mcp>=2.0" "anywidget>=0.9" "traitlets>=5" "jupyter-ui-poll>=0.2"
          PYTHONPATH=GeoLibre/python/src python -m geolibre.mcp --help

      - name: Build analysis with official SEGIS data and GeoLibre MCP
        run: |
          PYTHONPATH=GeoLibre/python/src python .github/scripts/build_yilan_vulnerable_transit_gap.py

      - name: Verify standard text deliverables
        run: |
          OUT="GeoLibre-Web/analysis/yilan-vulnerable-transit-gap"
          test -s "$OUT/map.geolibre.json"
          test -s "$OUT/result.csv"
          test -s "$OUT/report.md"
          test -s "$OUT/summary.json"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("GeoLibre-Web/analysis/yilan-vulnerable-transit-gap/summary.json")
          j=json.loads(p.read_text(encoding="utf-8"))
          assert j["status"]=="completed"
          assert j["result_count"]==233
          assert j["mcp_validation"]["status"]=="pass"
          print("standard deliverables OK; top result:", j["top_results"][0])
          PY

      - name: Commit analysis results
        run: |
          OUT="GeoLibre-Web/analysis/yilan-vulnerable-transit-gap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT/map.geolibre.json" "$OUT/result.csv" "$OUT/report.md" "$OUT/summary.json"
          if git diff --cached --quiet; then
            echo "No analysis changes."
          else
            git commit -m "feat(gis): add Yilan vulnerable elderly transit-gap analysis"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
