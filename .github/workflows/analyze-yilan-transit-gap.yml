name: Analyze Yilan vulnerable-transit gap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/analyze-yilan-transit-gap.yml"

permissions:
  contents: read

jobs:
  inspect-segis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Download and inspect SEGIS GeoJSON
        run: |
          python -m pip install requests
          python - <<'PY'
          import requests, json, re, xml.etree.ElementTree as ET

          urls = {
            "economic": "https://segisws.moi.gov.tw/STATWSSTData/OpenService.asmx/GetAdminSTDataForOpenCode?oCode=ECC48479C0B91632E91C5874DF23C60E51A1FBEE829C41DB1C77A88194F09938EEEF8D4FBBD14F1FEDD4BAFEE0D072B7DDE79C332EB9258D",
            "convenience": "https://segisws.moi.gov.tw/STATWSSTData/OpenService.asmx/GetAdminSTDataForOpenCode?oCode=ECC48479C0B91632E91C5874DF23C60E51A1FBEE829C41DB1C77A88194F09938197BD211528B77F4EDD4BAFEE0D072B7DDE79C332EB9258D",
          }
          def parse(text):
            text=text.lstrip("\ufeff").strip()
            if text.startswith("<"):
              root=ET.fromstring(text)
              text="".join(root.itertext()).strip()
            try:
              return json.loads(text)
            except Exception:
              # Some services double-encode JSON.
              obj=json.loads(text.strip('"'))
              return obj

          for name,url in urls.items():
            r=requests.get(url,headers={"User-Agent":"Mozilla/5.0"},timeout=90)
            print("\n===",name,"status",r.status_code,"bytes",len(r.content),"ctype",r.headers.get("content-type"),"===")
            r.raise_for_status()
            obj=parse(r.text)
            print("root type",type(obj).__name__)
            if isinstance(obj,dict):
              print("root keys",list(obj)[:30])
              fs=obj.get("features") or obj.get("Features") or []
            elif isinstance(obj,list):
              fs=obj
            else:
              fs=[]
            print("feature/row count",len(fs))
            if fs:
              first=fs[0]
              props=first.get("properties",first) if isinstance(first,dict) else first
              print("property keys",list(props)[:80] if isinstance(props,dict) else type(props).__name__)
              # identify county property names/values
              y=[]
              for x in fs:
                p=x.get("properties",x) if isinstance(x,dict) else {}
                if any("宜蘭" in str(v) for v in p.values()):
                  y.append(p)
              print("Yilan rows",len(y))
              for p in y[:5]:
                print("YILAN_SAMPLE",json.dumps(p,ensure_ascii=False)[:4000])
          PY
