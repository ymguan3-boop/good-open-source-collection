name: Run Yilan public facility exposure analysis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "GeoLibre-Web/tasks/yilan-public-facility-hazard-exposure-2026-09.json"

permissions:
  contents: write

concurrency:
  group: geolibre-yilan-public-facility-exposure
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve profile and task
        id: task
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path.cwd().resolve()
          profile_path = root / ".geolibre/skill-profile.json"
          if not profile_path.exists():
              raise SystemExit("Missing .geolibre/skill-profile.json")
          profile = json.loads(profile_path.read_text(encoding="utf-8"))

          source_path = str(profile.get("source_path", ".")).strip() or "."
          web_root = str(profile.get("web_root", "")).strip()
          if not web_root:
              web_root = str((Path(source_path) / "GeoLibre-Web").as_posix())
          manifest_rel = "GeoLibre-Web/tasks/yilan-public-facility-hazard-exposure-2026-09.json"
          if not manifest_rel:
              manifest_rel = str((Path(web_root) / "tasks/current-task.json").as_posix())
          analysis_root = str(profile.get("analysis_root", "")).strip()
          if not analysis_root:
              analysis_root = str((Path(web_root) / "analysis").as_posix())

          manifest = (root / manifest_rel).resolve()
          try:
              manifest.relative_to(root)
          except ValueError:
              raise SystemExit("Task manifest resolved outside repository")
          if not manifest.exists():
              raise SystemExit(f"Task manifest not found: {manifest_rel}")

          data = json.loads(manifest.read_text(encoding="utf-8"))
          if not data.get("enabled", False):
              raise SystemExit("Task manifest is disabled")

          task_id = str(data.get("task_id", "")).strip()
          script = str(data.get("script", "")).strip()
          execution_mode = str(data.get("execution_mode", "analysis")).strip() or "analysis"
          if execution_mode not in {"analysis", "postprocess_only"}:
              raise SystemExit("execution_mode must be analysis or postprocess_only")
          if not task_id or not script:
              raise SystemExit("task_id and script are required")

          script_path = (root / script).resolve()
          try:
              script_path.relative_to(root)
          except ValueError:
              raise SystemExit("Script resolved outside repository")
          if not script_path.is_file():
              raise SystemExit(f"Task script does not exist: {script}")

          output_dir = (root / analysis_root / task_id).resolve()
          try:
              output_dir.relative_to(root)
          except ValueError:
              raise SystemExit("Output directory resolved outside repository")
          output_dir.mkdir(parents=True, exist_ok=True)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"task_id={task_id}\n")
              fh.write(f"script={script_path.relative_to(root).as_posix()}\n")
              fh.write(f"manifest={manifest.relative_to(root).as_posix()}\n")
              fh.write(f"output_dir={output_dir.relative_to(root).as_posix()}\n")
              fh.write(f"execution_mode={execution_mode}\n")
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install GIS dependencies
        if: steps.task.outputs.execution_mode != 'postprocess_only'
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unrar-free unar
          python -m pip install --upgrade pip
          pip install numpy pandas requests pillow pyproj shapely geopandas rasterio scipy scikit-learn openpyxl markdown

      - name: Run GeoLibre GIS analysis
        if: steps.task.outputs.execution_mode != 'postprocess_only'
        env:
          GEOLIBRE_TASK_MANIFEST: ${{ steps.task.outputs.manifest }}
          GEOLIBRE_OUTPUT_DIR: ${{ steps.task.outputs.output_dir }}
        run: |
          python "${{ steps.task.outputs.script }}"

      - name: Optimize GeoLibre project for web/mobile
        shell: bash
        env:
          OUTPUT_DIR: ${{ steps.task.outputs.output_dir }}
          GEOLIBRE_PROJECT_TARGET_BYTES: 2097152
          GEOLIBRE_PROJECT_HARD_BYTES: 5242880
          GEOLIBRE_INLINE_LAYER_MAX_BYTES: 262144
          GEOLIBRE_INITIAL_LOAD_SOFT_BYTES: 6291456
          GEOLIBRE_INITIAL_LOAD_HARD_BYTES: 12582912
          GEOLIBRE_MAX_VISIBLE_THEMATIC_LAYERS: 3
        run: |
          if [ ! -f ".geolibre/tools/optimize-project.py" ]; then
            echo "Missing .geolibre/tools/optimize-project.py"
            exit 1
          fi
          python ".geolibre/tools/optimize-project.py" "${OUTPUT_DIR}"

      - name: Validate required outputs
        shell: bash
        env:
          OUTPUT_DIR: ${{ steps.task.outputs.output_dir }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          out = Path(os.environ["OUTPUT_DIR"])
          required = [
              out / "map.geolibre.json",
              out / "result.geojson",
              out / "result.csv",
              out / "result.xlsx",
              out / "report.md",
              out / "report.html",
              out / "sensitive-schools.geojson",
              out / "sensitive-schools.csv",
              out / "scope.geojson",
              out / "index.html",
              out / "summary.json",
              out / "performance.json",
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit("Missing required outputs: " + ", ".join(missing))
          summary = json.loads((out / "summary.json").read_text(encoding="utf-8"))
          perf = json.loads((out / "performance.json").read_text(encoding="utf-8"))
          if not perf.get("project_budget_ok", False):
              raise SystemExit("Project-size hard budget failed")
          if not perf.get("inline_budget_ok", False):
              raise SystemExit("Inline GeoJSON budget failed")
          if not perf.get("visible_layer_budget_ok", False):
              raise SystemExit("Default-visible thematic layer budget failed")
          if not perf.get("mobile_hard_budget_ok", False):
              raise SystemExit("Mobile initial-load hard budget failed")
          result = json.loads((out / "result.geojson").read_text(encoding="utf-8"))
          schools = json.loads((out / "sensitive-schools.geojson").read_text(encoding="utf-8"))
          project = json.loads((out / "map.geolibre.json").read_text(encoding="utf-8"))
          if len(result.get("features", [])) != summary["result_count"]:
              raise SystemExit("Result GeoJSON and summary count differ")
          if len(schools.get("features", [])) != summary["schools_inside_geological_sensitive_area_count"]:
              raise SystemExit("School GeoJSON and summary count differ")
          layers = {layer["id"]: layer for layer in project.get("layers", [])}
          for layer_id, count in [("yilan-public-facility-exposure", summary["result_count"]), ("yilan-sensitive-schools", summary["schools_inside_geological_sensitive_area_count"])]:
              layer = layers.get(layer_id, {})
              if len(layer.get("geojson", {}).get("features", [])) != count:
                  raise SystemExit(f"Map layer {layer_id} does not embed the expected features")
          report = (out / "report.md").read_text(encoding="utf-8")
          for section in ["## 方法", "## 分類", "## 資料品質", "## 重要限制", "## 資料來源", "## 交付檔案"]:
              if section not in report:
                  raise SystemExit(f"Human-readable report is missing: {section}")
          if "<table>" not in (out / "report.html").read_text(encoding="utf-8"):
              raise SystemExit("Browser-readable report has no rendered data tables")
          print("Result count:", summary.get("result_count", "unknown"))
          print("High-risk count:", summary.get("high_risk_count", "unknown"))
          print("Project bytes:", perf.get("project_final_bytes", "unknown"))
          print("Initial-load estimate:", perf.get("initial_load_bytes_estimate", "unknown"))
          if not perf.get("mobile_soft_budget_ok", True):
              print("WARNING: soft mobile budget exceeded; consider an even smaller overview.")
          PY

      - name: Commit generated analysis outputs
        shell: bash
        run: |
          OUT="${{ steps.task.outputs.output_dir }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${OUT}"
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "data(gis): publish GeoLibre analysis ${{ steps.task.outputs.task_id }}"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Wait for the published GeoLibre project
        shell: bash
        env:
          OUTPUT_DIR: ${{ steps.task.outputs.output_dir }}
        run: |
          python - <<'PY'
          import json, os, time
          from urllib.request import Request, urlopen
          from pathlib import Path

          out = Path(os.environ["OUTPUT_DIR"])
          project = json.loads((out / "map.geolibre.json").read_text(encoding="utf-8"))
          url = project["metadata"]["projectUrl"]
          expected = project["metadata"]["generatedAt"]
          check_url = url + "?qa=" + str(int(time.time()))
          for attempt in range(40):
              try:
                  req = Request(check_url, headers={"Cache-Control": "no-cache", "User-Agent": "GeoLibre-viewer-QA"})
                  with urlopen(req, timeout=25) as response:
                      published = json.loads(response.read().decode("utf-8"))
                  actual = published.get("metadata", {}).get("generatedAt")
                  if actual == expected:
                      print("Pages now serves this run's map project:", actual)
                      break
                  print(f"Waiting for Pages deployment ({attempt + 1}/40): {actual!r} != {expected!r}")
              except Exception as exc:
                  print(f"Waiting for Pages deployment ({attempt + 1}/40): {exc}")
              time.sleep(15)
          else:
              raise SystemExit("GitHub Pages did not publish the map project produced by this run")
          PY

      - name: Install Playwright browser for dual-entry QA
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Verify self-hosted and official GeoLibre on desktop and Android viewport
        env:
          OUTPUT_DIR: ${{ steps.task.outputs.output_dir }}
        run: python scripts/geolibre_tasks/verify_yilan_viewers.py "${OUTPUT_DIR}"

      - name: Regenerate report with final browser QA status
        shell: bash
        env:
          OUTPUT_DIR: ${{ steps.task.outputs.output_dir }}
        run: |
          PYTHONPATH=scripts/geolibre_tasks python - <<'PY'
          import os
          from pathlib import Path
          from build_yilan_full_report import build_report
          build_report(Path(os.environ["OUTPUT_DIR"]))
          PY

      - name: Commit browser QA evidence and final report
        shell: bash
        run: |
          OUT="${{ steps.task.outputs.output_dir }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${OUT}"
          if git diff --cached --quiet; then
            echo "No QA evidence or report changes."
          else
            git commit -m "docs(gis): publish viewer QA and complete report"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Validate final report, workbook and viewer QA gate
        shell: bash
        env:
          OUTPUT_DIR: ${{ steps.task.outputs.output_dir }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from openpyxl import load_workbook

          out = Path(os.environ["OUTPUT_DIR"])
          required = ["report.md", "report.html", "viewer-qa/viewer-qa.json", "map-overview.png"]
          missing = [name for name in required if not (out / name).is_file()]
          if missing:
              raise SystemExit("Missing final report/QA outputs: " + ", ".join(missing))
          summary = json.loads((out / "summary.json").read_text(encoding="utf-8"))
          qa = json.loads((out / "viewer-qa/viewer-qa.json").read_text(encoding="utf-8"))
          if not qa.get("overall_pass"):
              raise SystemExit("No GeoLibre entry passed both desktop and Android viewport checks")
          report = (out / "report.md").read_text(encoding="utf-8")
          required_sections = ["## 方法", "## 分類", "## 資料品質", "## 重要限制", "## 資料來源", "## 交付檔案", "## 圖層—圖資—檔案對照", "## 瀏覽器畫面驗證", "## 總結"]
          if any(section not in report for section in required_sections):
              raise SystemExit("Final report is missing a required section")
          if "尚未取得雙入口桌面／手機驗收結果" in report:
              raise SystemExit("Final report still contains a pending QA status")
          for name in ["self_hosted", "official"]:
              for mode in ["desktop", "android"]:
                  check = qa["checks"][name][mode]
                  screenshot = out / check.get("screenshot", "")
                  if not screenshot.is_file():
                      raise SystemExit(f"Missing screenshot for {name}/{mode}")
          wb = load_workbook(out / "result.xlsx", read_only=True, data_only=True)
          sheet = wb["分析結果"]
          row_count = max(0, sheet.max_row - 1)
          wb.close()
          if row_count != summary["result_count"]:
              raise SystemExit(f"XLSX result rows {row_count} != result_count {summary['result_count']}")
          print("Final QA PASS:", qa["overall_pass"])
          print("XLSX result rows:", row_count)
          PY
