name: Fetch Yilan vulnerable-transit SEGIS JSON

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-yilan-transit-gap-json.yml"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Fetch JSON tables
        run: |
          python -m pip install requests
          python - <<'PY'
          import requests, json, xml.etree.ElementTree as ET
          urls={
            "economic":"https://segisws.moi.gov.tw/STATWSSTData/OpenService.asmx/GetAdminSTDataForOpenCode?oCode=ECC48479C0B91632E91C5874DF23C60E51A1FBEE829C41DB1C77A88194F09938B9422055B5A47ABBD5421BC7960893AF",
            "convenience":"https://segisws.moi.gov.tw/STATWSSTData/OpenService.asmx/GetAdminSTDataForOpenCode?oCode=ECC48479C0B91632E91C5874DF23C60E51A1FBEE829C41DB1C77A88194F099384417DC0FB883090CD5421BC7960893AF",
          }
          def unwrap(text):
            t=text.lstrip("\ufeff").strip()
            if t.startswith("<"):
              root=ET.fromstring(t); t="".join(root.itertext()).strip()
            x=json.loads(t)
            if isinstance(x,str): x=json.loads(x)
            return x
          for name,url in urls.items():
            r=requests.get(url,headers={"User-Agent":"Mozilla/5.0"},timeout=60)
            print("\n==",name,r.status_code,len(r.content),r.headers.get("content-type"))
            r.raise_for_status()
            obj=unwrap(r.text)
            print("INFO",json.dumps(obj.get("Info",{}),ensure_ascii=False)[:4000])
            print("COLUMNS",json.dumps(obj.get("ColumnList",[]),ensure_ascii=False)[:12000])
            rows=obj.get("RowDataList") or []
            print("ROWS",len(rows))
            print("FIRST_ROW",json.dumps(rows[0] if rows else None,ensure_ascii=False)[:8000])
            y=[]
            for row in rows:
              if isinstance(row,dict) and any("宜蘭" in str(v) for v in row.values()):
                y.append(row)
              elif isinstance(row,list) and any("宜蘭" in str(v) for v in row):
                y.append(row)
            print("YILAN",len(y))
            for p in y[:10]: print("SAMPLE",json.dumps(p,ensure_ascii=False)[:8000])
          PY
