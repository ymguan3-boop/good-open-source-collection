name: GeoLibre Viewer QA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/geolibre-viewer-qa.yml"
      - "scripts/geolibre-viewer-qa.mjs"
      - "GeoLibre-Web/analysis/yilan-road-repeat-construction-audit-2026-09/map.geolibre.json"
      - "GeoLibre-Web/analysis/yilan-road-repeat-construction-audit-2026-09/index.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: geolibre-viewer-qa-yilan-road-repeat
  cancel-in-progress: true

jobs:
  viewer-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEOLIBRE_TASK_ID: yilan-road-repeat-construction-audit-2026-09
      GEOLIBRE_PROJECT_URL: https://ymguan3-boop.github.io/good-open-source-collection/GeoLibre-Web/analysis/yilan-road-repeat-construction-audit-2026-09/map.geolibre.json?v=89e1b9b
      GEOLIBRE_QA_DIR: GeoLibre-Web/analysis/yilan-road-repeat-construction-audit-2026-09/viewer-qa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser QA dependencies
        run: |
          npm install --no-save playwright pngjs
          npx playwright install --with-deps chromium

      - name: Wait for GitHub Pages propagation
        shell: bash
        run: |
          for i in {1..18}; do
            code=$(curl -L -s -o /tmp/project.json -w "%{http_code}" "$GEOLIBRE_PROJECT_URL" || true)
            if [ "$code" = "200" ] && grep -q '"repeat-hotspots"' /tmp/project.json; then
              echo "Published project is available."
              exit 0
            fi
            echo "Waiting for Pages... attempt $i HTTP=$code"
            sleep 10
          done
          echo "Published project did not become available in time."
          exit 1

      - name: Verify self-hosted and official viewer screens
        run: node scripts/geolibre-viewer-qa.mjs

      - name: Commit QA evidence
        if: always()
        shell: bash
        run: |
          if [ ! -d "$GEOLIBRE_QA_DIR" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$GEOLIBRE_QA_DIR"
          if git diff --cached --quiet; then
            echo "No QA changes to commit."
            exit 0
          fi
          git commit -m "test(gis): record GeoLibre viewer screen QA"
          git pull --rebase origin main
          git push
