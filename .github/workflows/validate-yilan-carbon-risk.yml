name: Validate Yilan carbon-risk GeoLibre project

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "GeoLibre/projects/yilan-old-building-carbon-risk/yilan-old-building-carbon-risk.geolibre.json"
      - "GeoLibre/projects/yilan-old-building-carbon-risk/validate_with_mcp.py"
      - ".github/workflows/validate-yilan-carbon-risk.yml"
      - "GeoLibre/python/src/geolibre/**"

permissions:
  contents: write

concurrency:
  group: validate-yilan-carbon-risk
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install GeoLibre MCP runtime
        run: |
          python -m pip install --upgrade pip
          # GeoLibre source is already vendored in this repository. Install the
          # optional MCP/runtime dependencies, then import GeoLibre directly from source.
          python -m pip install "mcp>=2.0" "anywidget>=0.9" "traitlets>=5" "jupyter-ui-poll>=0.2" pillow playwright
          PYTHONPATH=GeoLibre/python/src python -c "import geolibre, mcp; print('GeoLibre', geolibre.__version__); print('MCP import OK')"

      - name: Smoke-test GeoLibre MCP entry point
        run: |
          PYTHONPATH=GeoLibre/python/src python -m geolibre.mcp --help

      - name: Rebuild and validate through MCP tools
        run: |
          PYTHONPATH=GeoLibre/python/src python GeoLibre/projects/yilan-old-building-carbon-risk/validate_with_mcp.py

      - name: Verify standalone HTML structure
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("GeoLibre/projects/yilan-old-building-carbon-risk/mcp-validated/map.html")
          text = p.read_text(encoding="utf-8")
          required = [
              "https://web.geolibre.app/?embed=1",
              "geolibre:load-project",
              'id="geolibre-project"',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit("Missing HTML bridge markers: " + ", ".join(missing))
          print("Standalone HTML bridge markers OK:", p.stat().st_size, "bytes")
          PY

      - name: Browser visual validation with Playwright
        run: |
          OUT="GeoLibre/projects/yilan-old-building-carbon-risk/mcp-validated"
          URL="https://ymguan3-boop.github.io/good-open-source-collection/GeoLibre/projects/yilan-old-building-carbon-risk/mcp-validated/map.html"

          for i in {1..18}; do
            if curl -fsS "$URL" -o /tmp/yilan-map.html; then
              echo "Pages URL reachable on attempt $i"
              break
            fi
            sleep 5
          done
          test -s /tmp/yilan-map.html

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          from playwright.sync_api import sync_playwright
          import json, shutil

          out = Path("GeoLibre/projects/yilan-old-building-carbon-risk/mcp-validated")
          wrapper_url = "https://ymguan3-boop.github.io/good-open-source-collection/GeoLibre/projects/yilan-old-building-carbon-risk/mcp-validated/map.html"
          direct_url = "https://web.geolibre.app/?embed=1"
          chrome = shutil.which("google-chrome") or shutil.which("chromium")
          if not chrome:
              raise SystemExit("Chrome/Chromium not found on runner")

          diagnostics = {"wrapper_url": wrapper_url, "direct_url": direct_url, "console": [], "errors": []}

          def analyze(path: Path):
              im = Image.open(path).convert("RGB")
              variance = sum(ImageStat.Stat(im).var)
              extrema = im.getextrema()
              return {
                  "width": im.width,
                  "height": im.height,
                  "bytes": path.stat().st_size,
                  "rgb_variance_sum": variance,
                  "extrema": extrema,
                  "non_blank": variance > 1.0,
              }

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  executable_path=chrome,
                  headless=True,
                  args=[
                      "--no-sandbox",
                      "--enable-webgl",
                      "--use-gl=angle",
                      "--use-angle=swiftshader",
                      "--enable-unsafe-swiftshader",
                  ],
              )
              page = browser.new_page(viewport={"width": 1440, "height": 1000})
              page.on("console", lambda m: diagnostics["console"].append(f"{m.type}: {m.text}"))
              page.on("pageerror", lambda e: diagnostics["errors"].append(str(e)))
              page.goto(direct_url, wait_until="domcontentloaded", timeout=60000)
              page.wait_for_timeout(12000)
              direct_path = out / "render-direct-viewer.png"
              page.screenshot(path=str(direct_path), full_page=True)
              diagnostics["direct"] = analyze(direct_path)

              page.goto(wrapper_url, wait_until="domcontentloaded", timeout=60000)
              page.wait_for_timeout(18000)
              diagnostics["frames"] = [frame.url for frame in page.frames]
              diagnostics["iframe_count"] = page.locator("iframe").count()
              if diagnostics["iframe_count"]:
                  diagnostics["iframe_box"] = page.locator("iframe").first.bounding_box()
              wrapper_path = out / "render.png"
              page.screenshot(path=str(wrapper_path), full_page=True)
              diagnostics["wrapper"] = analyze(wrapper_path)
              browser.close()

          (out / "render-validation.json").write_text(
              json.dumps(diagnostics, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(diagnostics, ensure_ascii=False, indent=2))

          if not diagnostics["direct"]["non_blank"]:
              raise SystemExit("Direct GeoLibre viewer is blank in headless browser; renderer-level visual verification is unavailable")
          if not diagnostics["wrapper"]["non_blank"]:
              raise SystemExit("Exported GeoLibre wrapper is blank although direct viewer renders")
          if not any("web.geolibre.app" in u for u in diagnostics.get("frames", [])):
              raise SystemExit("Exported page did not load the GeoLibre iframe")
          PY

      - name: Commit MCP validation outputs
        run: |
          OUT="GeoLibre/projects/yilan-old-building-carbon-risk/mcp-validated"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then
            echo "No validation changes."
          else
            git commit -m "test(gis): validate Yilan carbon-risk project through GeoLibre MCP"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
