name: Probe ODPortal cached Yilan resource

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-odportal.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe cached Yilan XML
        shell: bash
        run: |
          python - <<'PY'
          import requests,hashlib
          s=requests.Session(); s.headers["User-Agent"]="Mozilla/5.0"
          urls=[
            "https://cdn.odportal.tw/api/v1/resource/DSNTMGUM/61b504bb6e97860024674b09",
            "https://odportal.tw/api/v1/resource/DSNTMGUM/61b504bb6e97860024674b09",
            "https://cdn.odportal.tw/playground/DSNTMGUM?r=61b504bb6e97860024674b09",
          ]
          for u in urls:
              try:
                  r=s.get(u,timeout=60,allow_redirects=False)
                  print("\nTEST",r.status_code,u)
                  print("CT",r.headers.get("content-type"),"LOC",r.headers.get("location"),"LEN",len(r.content),"SHA256",hashlib.sha256(r.content).hexdigest())
                  print("HEAD",r.text[:7000].replace("\n"," ")[:7000])
              except Exception as e:
                  print("ERR",u,repr(e))
          PY
