name: Probe ODPortal snapshot API

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-odportal.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe ODPortal frontend API
        shell: bash
        run: |
          python - <<'PY'
          import requests,re,html,json
          from urllib.parse import urljoin
          s=requests.Session()
          s.headers["User-Agent"]="Mozilla/5.0"
          page="https://odportal.tw/dataset/DSNTMGUM"
          r=s.get(page,timeout=30)
          print("PAGE",r.status_code,len(r.content),r.url)
          t=html.unescape(r.text).replace("\\/","/")
          scripts=[urljoin(r.url,x) for x in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',t,re.I)]
          print("SCRIPTS",len(scripts))
          for u in scripts:
              try:
                  rr=s.get(u,timeout=30)
                  txt=rr.text
                  hits=[]
                  for pat in ("version","versions","snapshot","collectionId","collectionName","dataset/","api/","_id"):
                      if pat in txt:
                          hits.append(pat)
                  if hits:
                      print("\nSCRIPT",u,rr.status_code,len(rr.content),"HITS",hits)
                      # Print compact contexts only around likely API route strings.
                      for m in re.finditer(r'[^"\']{0,120}(?:api|version|snapshot|collectionId)[^"\']{0,220}',txt,re.I):
                          seg=m.group(0)
                          if any(k in seg.lower() for k in ("fetch(","axios","/api/","version","snapshot","collectionid")):
                              print("CTX",seg[:500])
              except Exception as e:
                  print("SCRIPT_ERR",u,repr(e))
          PY
