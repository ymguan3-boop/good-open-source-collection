name: Probe ODPortal resourcedata API

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-odportal.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe resourcedata
        shell: bash
        run: |
          python - <<'PY'
          import requests,hashlib
          s=requests.Session(); s.headers["User-Agent"]="Mozilla/5.0"
          urls=[
            "https://cdn.odportal.tw/api/v1/resourcedata/DSNTMGUM/61b504bb6e97860024674b09.csv?251125",
            "https://cdn.odportal.tw/api/v1/resourcedata/DSNTMGUM/61b504bb6e97860024674b09.csv",
          ]
          for u in urls:
              try:
                  r=s.get(u,timeout=60)
                  print("\nTEST",r.status_code,u)
                  print("CT",r.headers.get("content-type"),"LEN",len(r.content),"X-TOTAL",r.headers.get("x-total-count"),"X-TYPE",r.headers.get("x-content-type"),"ENC",r.headers.get("x-content-encoding"))
                  print("SHA256",hashlib.sha256(r.content).hexdigest())
                  print("HEAD",r.text[:12000].replace("\n","\\n"))
              except Exception as e:
                  print("ERR",u,repr(e))
          PY
